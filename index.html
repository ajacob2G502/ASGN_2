<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenRead</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="portal-header">
      <div class="header-content">
        <div class="brand">
          <span class="brand-icon">♻️</span>
          <h1>GreenRead <span class="brand-sub">Sensor Logger</span></h1>
          <div class="header-status">
            Bays Logged: <span id="queue-count" class="badge-count">0</span>
          </div>
        </div>
      </div>
    </header>

    <main class="portal-container">
      <aside class="panel form-panel">
        <h2 class="panel-title">Record Sensor Data</h2>
        <div
          id="form-error-panel"
          class="alert alert-danger hidden"
          role="alert"
        ></div>

        <form action="#" id="sensor-form" novalidate>
          <div class="form-group">
            <label for="bay-name" class="form-label"
              >Bay Name <span class="required">*</span></label
            >
            <input
              type="text"
              name="bay-name"
              id="bay-name"
              class="form-control"
              placeholder="e.g. Bay 4"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="ph" class="form-label"
                >pH (0-14) <span class="required">*</span></label
              >
              <input
                type="number"
                name="ph"
                id="ph"
                class="form-control"
                min="0"
                max="14"
                placeholder="8.6"
                required
              />
            </div>
            <div class="form-group">
              <label for="ec" class="form-label"
                >Elec. Conductivity (S/m) <span class="required">*</span></label
              >
              <input
                type="number"
                name="ec"
                id="ec"
                class="form-control"
                min="40"
                max="150"
                placeholder="75.8"
                required
              />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="temp" class="form-label"
                >Temperature (C) <span class="required">*</span></label
              >
              <input
                type="number"
                name="temp"
                id="temp"
                class="form-control"
                min="0"
                max="240"
                placeholder="72"
                required
              />
            </div>
            <div class="form-group">
              <label for="hm" class="form-label"
                >Humidity (%) <span class="required">*</span></label
              >
              <input
                type="number"
                name="hm"
                id="hm"
                class="form-control"
                min="0"
                max="100"
                placeholder="47.5"
                required
              />
            </div>
          </div>

          <button
            type="submit"
            id="btn-submit"
            class="btn btn-primary btn-block"
          >
            Log Sensor Record
          </button>
        </form>
      </aside>

      <section class="panel records-panel">
        <div class="records-header">
          <h2 class="panel-title">Sensor Queue</h2>
          <button id="btn-clear-all" class="btn btn-outline-danger btn-sm">
            Purge Queue
          </button>
        </div>

        <div id="empty-state" class="empty-state">
          <span class="empty-icon">📋</span>
          <p>No active sensor records.</p>
        </div>

        <ul id="records-list" class="records-grid" aria-live="polite"></ul>
      </section>
    </main>

    <footer class="portal-footer">
      <p>&copy; 2026 CSI 3150 Project 2</p>
    </footer>

    <!-- integrate the JS file here -->
    <script src="app.js" defer></script>
  </body>
</html>
